# Compila y corre todos los tests con JDK 21 (la versión que declara el informe) en cada push
# y en cada pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y correr los tests
        run: mvn -B verify
